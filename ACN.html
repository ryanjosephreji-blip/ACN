<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCart - Student BNPL E-Commerce</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f9fafb; }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="antialiased text-gray-900">
  <div class="min-h-screen flex flex-col">
    <div id="app-root" class="flex-grow"></div>
  </div>

  <script>
    // App State
    const products = [
        { id: 1, name: "Noise-Cancelling Headphones", price: 299.99, category: "Electronics", img: "🎧" },
        { id: 2, name: "College Textbook: Economics", price: 120.00, category: "Books", img: "📚" },
        { id: 3, name: "Smart Watch Series 5", price: 199.99, category: "Electronics", img: "⌚" },
        { id: 4, name: "Designer Sneakers", price: 150.00, category: "Fashion", img: "👟" },
        { id: 5, name: "Gaming Laptop Pro", price: 1299.99, category: "Electronics", img: "💻" },
        { id: 6, name: "Study Desk Lamp", price: 45.00, category: "Home", img: "💡" }
    ];

    let view = 'store'; // 'store' | 'cart' | 'checkout' | 'dashboard'
    let cart = [];
    let bnplPlans = [];
    let budget = 500;
    let checkoutMethod = 'bnpl';

    // State Modifiers
    function setView(newView) {
        view = newView;
        render();
    }

    function addToCart(productId) {
        const p = products.find(p => p.id === productId);
        cart.push(p);
        render();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        render();
    }

    function handleCheckout() {
        const total = cart.reduce((s, i) => s + i.price, 0);
        if (checkoutMethod === 'bnpl') {
            bnplPlans.push({
                id: Date.now(),
                total: total,
                installment: total / 4,
                remaining: total - (total / 4),
                paymentsLeft: 3,
                items: [...cart]
            });
        }
        cart = [];
        setView('dashboard');
    }

    function setCheckoutMethod(m) {
        checkoutMethod = m;
        render();
    }

    // Rendering Engine
    function render() {
        const root = document.getElementById('app-root');
        root.innerHTML = `
            <!-- Navbar -->
            <nav class="bg-[#4F46E5] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
                <div class="container mx-auto flex justify-between items-center">
                    <div class="text-2xl font-bold cursor-pointer" onclick="setView('store')">🎓 EduCart</div>
                    <div class="space-x-6 flex items-center text-sm font-medium">
                        <button onclick="setView('store')" class="hover:text-indigo-200 ${view === 'store' ? 'font-bold underline' : ''}">Shop</button>
                        <button onclick="setView('dashboard')" class="hover:text-indigo-200 ${view === 'dashboard' ? 'font-bold underline' : ''}">BNPL Dashboard</button>
                        <button onclick="setView('cart')" class="hover:text-indigo-200 relative ${view === 'cart' ? 'font-bold underline' : ''}">
                            🛒 Cart
                            ${cart.length > 0 ? `<span class="absolute -top-2 -right-3 bg-red-500 text-xs font-bold rounded-full px-1.5 py-0.5">${cart.length}</span>` : ''}
                        </button>
                    </div>
                </div>
            </nav>
            <main class="container mx-auto p-4 mt-6">
                ${view === 'store' ? renderStore() : ''}
                ${view === 'cart' ? renderCart() : ''}
                ${view === 'checkout' ? renderCheckout() : ''}
                ${view === 'dashboard' ? renderDashboard() : ''}
            </main>
        `;
    }

    function renderStore() {
        return `
            <div class="fade-in">
                <div class="mb-8 bg-indigo-50 p-8 rounded-xl text-indigo-900 border border-indigo-100 shadow-sm">
                    <h1 class="text-3xl font-bold mb-3">Welcome to EduCart!</h1>
                    <p class="text-lg opacity-90 max-w-2xl">Shop student essentials. Checkout with integrated Buy Now, Pay Later options designed to help you manage your student budget efficiently.</p>
                </div>
                <h2 class="text-2xl font-bold mb-6 text-gray-800">Trending Products</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    ${products.map(p => `
                        <div class="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden p-6 flex flex-col justify-between hover:shadow-lg transition-shadow">
                            <div>
                                <div class="text-6xl text-center mb-6 bg-gray-50 py-8 rounded-xl border border-gray-100">${p.img}</div>
                                <span class="text-[10px] font-bold text-indigo-500 uppercase tracking-wider">${p.category}</span>
                                <h3 class="text-xl font-bold text-gray-900 mt-2">${p.name}</h3>
                                <div class="text-2xl font-black text-gray-900 mt-3">$${p.price.toFixed(2)}</div>
                            </div>
                            <div class="mt-6">
                                <div class="text-sm text-green-700 bg-green-50 p-3 rounded-lg border border-green-100 mb-4 text-center font-medium">
                                    Or 4 payments of <strong class="text-base">$${(p.price / 4).toFixed(2)}</strong>
                                </div>
                                <button onclick="addToCart(${p.id})" class="w-full bg-[#4F46E5] text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition shadow-sm">Add to Cart</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function renderCart() {
        const total = cart.reduce((s, i) => s + i.price, 0);
        if (cart.length === 0) {
            return `<div class="text-center py-20 fade-in bg-white rounded-xl shadow-sm border border-gray-100">
                <div class="text-6xl mb-6 opacity-30">🛒</div>
                <h2 class="text-2xl font-bold text-gray-700">Your cart is empty</h2>
                <p class="text-gray-500 mt-2">Looks like you haven't added any items yet.</p>
                <button onclick="setView('store')" class="mt-8 bg-[#4F46E5] text-white px-8 py-3 rounded-lg font-semibold shadow hover:bg-indigo-700 transition">Start Shopping</button>
            </div>`;
        }
        return `
            <div class="fade-in flex flex-col lg:flex-row gap-8">
                <div class="flex-grow bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-2xl font-bold mb-6 text-gray-800">Shopping Cart</h2>
                    <div class="divide-y divide-gray-100">
                        ${cart.map((item, idx) => `
                            <div class="py-5 flex justify-between items-center group">
                                <div class="flex items-center gap-5">
                                    <div class="text-4xl bg-gray-50 p-4 rounded-xl border border-gray-100">${item.img}</div>
                                    <div>
                                        <h3 class="font-bold text-gray-800 text-lg">${item.name}</h3>
                                        <p class="text-indigo-600 font-bold mt-1">$${item.price.toFixed(2)}</p>
                                    </div>
                                </div>
                                <button onclick="removeFromCart(${idx})" class="text-red-500 hover:text-red-700 font-medium px-4 py-2 bg-red-50 hover:bg-red-100 rounded-lg transition-colors">Remove</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="w-full lg:w-1/3 bg-white p-8 rounded-xl shadow-sm border border-gray-100 h-fit sticky top-24">
                    <h3 class="text-xl font-bold mb-6 text-gray-800">Order Summary</h3>
                    <div class="flex justify-between mb-4 text-gray-600 font-medium">
                        <span>Subtotal (${cart.length} items)</span>
                        <span>$${total.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between font-black text-3xl text-gray-900 mb-8 border-t border-gray-100 pt-6">
                        <span>Total</span>
                        <span>$${total.toFixed(2)}</span>
                    </div>
                    <button onclick="setView('checkout')" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-green-700 transition shadow-lg">Proceed to Checkout</button>
                </div>
            </div>
        `;
    }

    function renderCheckout() {
        const total = cart.reduce((s, i) => s + i.price, 0);
        const installment = total / 4;
        
        return `
            <div class="fade-in max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-3xl font-bold mb-8 text-gray-800 border-b border-gray-100 pb-6">Secure Checkout</h2>
                <div class="mb-10">
                    <h3 class="text-xl font-bold mb-6 text-gray-800">Select Payment Method</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div onclick="setCheckoutMethod('bnpl')" class="border-2 p-6 rounded-xl cursor-pointer transition-all ${checkoutMethod === 'bnpl' ? 'border-indigo-600 bg-indigo-50 ring-4 ring-indigo-50' : 'border-gray-200 hover:border-gray-300'}">
                            <div class="flex justify-between items-center font-black text-indigo-900 mb-3 text-lg">
                                <span class="flex items-center gap-3"><span class="text-2xl">📅</span> EduPay Later</span>
                                ${checkoutMethod === 'bnpl' ? '<span class="text-indigo-600 text-2xl font-bold">✓</span>' : ''}
                            </div>
                            <p class="text-sm text-gray-600 mt-2 mb-4">Split into 4 interest-free payments over 6 weeks.</p>
                            <div class="bg-white p-4 rounded-lg border border-indigo-100 flex justify-between items-center shadow-sm">
                                <span class="text-sm font-bold text-gray-700">Pay Today:</span>
                                <span class="text-lg font-black text-indigo-700">$${installment.toFixed(2)}</span>
                            </div>
                        </div>
                        <div onclick="setCheckoutMethod('card')" class="border-2 p-6 rounded-xl cursor-pointer transition-all ${checkoutMethod === 'card' ? 'border-indigo-600 bg-indigo-50 ring-4 ring-indigo-50' : 'border-gray-200 hover:border-gray-300'}">
                            <div class="flex justify-between items-center font-black text-gray-800 mb-3 text-lg">
                                <span class="flex items-center gap-3"><span class="text-2xl">💳</span> Credit / Debit</span>
                                ${checkoutMethod === 'card' ? '<span class="text-indigo-600 text-2xl font-bold">✓</span>' : ''}
                            </div>
                            <p class="text-sm text-gray-600 mt-2 mb-4">Pay the full amount immediately using your card.</p>
                            <div class="bg-white p-4 rounded-lg border border-gray-100 flex justify-between items-center shadow-sm">
                                <span class="text-sm font-bold text-gray-700">Pay Today:</span>
                                <span class="text-lg font-black text-gray-900">$${total.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                </div>

                ${checkoutMethod === 'bnpl' ? `
                    <div class="mb-10 p-6 bg-amber-50 border border-amber-200 rounded-xl flex gap-4 items-start shadow-sm">
                        <div class="text-amber-500 text-2xl mt-1">💡</div>
                        <div>
                            <h4 class="font-bold text-amber-900 mb-2 text-lg">Financial Awareness Tip</h4>
                            <p class="text-sm text-amber-800 leading-relaxed">Buy Now, Pay Later increases immediate affordability but creates future financial obligations. Research highlights that deferred payments can trigger impulse buying. Ensure this commitment fits comfortably within your monthly student budget.</p>
                        </div>
                    </div>
                ` : ''}

                <div class="border-t border-gray-100 pt-8 flex justify-between items-center mt-4">
                    <button onclick="setView('cart')" class="text-gray-500 hover:text-gray-800 text-base font-semibold transition flex items-center gap-2">← Return to Cart</button>
                    <button onclick="handleCheckout()" class="bg-[#4F46E5] text-white px-10 py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-indigo-700 transition transform hover:-translate-y-0.5">
                        Pay ${checkoutMethod === 'bnpl' ? `$${installment.toFixed(2)}` : `$${total.toFixed(2)}`} & Complete Order
                    </button>
                </div>
            </div>
        `;
    }

    function renderDashboard() {
        const totalMonthlyCommitment = bnplPlans.reduce((sum, plan) => sum + plan.installment, 0);
        const util = (totalMonthlyCommitment / budget) * 100;
        
        return `
            <div class="fade-in max-w-5xl mx-auto">
                <div class="flex justify-between items-end mb-8">
                    <div>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">Student Financial Dashboard</h2>
                        <p class="text-gray-500">Track your spending and manage your Buy Now, Pay Later commitments.</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-indigo-500 border-x border-b border-gray-100">
                        <h3 class="text-xs font-bold uppercase text-gray-500 tracking-wider mb-2">Active BNPL Plans</h3>
                        <div class="text-4xl font-black mt-2 text-gray-800">${bnplPlans.length}</div>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-amber-500 border-x border-b border-gray-100">
                        <h3 class="text-xs font-bold uppercase text-gray-500 tracking-wider mb-2">Upcoming Installments</h3>
                        <div class="text-4xl font-black mt-2 text-amber-600">$${totalMonthlyCommitment.toFixed(2)}</div>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-green-500 border-x border-b border-gray-100">
                        <h3 class="text-xs font-bold uppercase text-gray-500 mb-4 tracking-wider">Monthly Budget Utilized</h3>
                        <div class="flex justify-between text-sm mb-2 font-bold">
                            <span class="text-gray-700">${util.toFixed(0)}%</span>
                            <span class="text-gray-400">$${budget} Limit</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-3 overflow-hidden">
                            <div class="h-full rounded-full transition-all duration-700 ${util > 80 ? 'bg-red-500' : util > 50 ? 'bg-amber-400' : 'bg-green-500'}" style="width: ${Math.min(util, 100)}%"></div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 mb-8">
                    <h3 class="text-xl font-bold text-gray-800 mb-6 border-b border-gray-100 pb-4">Active BNPL Commitments</h3>
                    ${bnplPlans.length === 0 ? `
                        <div class="text-center py-10">
                            <div class="text-5xl mb-4 opacity-50">✨</div>
                            <p class="text-lg text-gray-600 font-semibold">No active plans.</p>
                            <p class="text-gray-400 text-sm mt-1">Great job keeping your financial commitments low!</p>
                        </div>
                    ` : `
                        <div class="divide-y divide-gray-100">
                            ${bnplPlans.map(plan => `
                                <div class="py-5 flex justify-between items-center">
                                    <div>
                                        <div class="font-bold text-gray-800 text-lg mb-1">${plan.items.map(i=>i.name).join(', ')}</div>
                                        <div class="text-sm text-red-500 font-semibold">Remaining Balance: $${plan.remaining.toFixed(2)} (${plan.paymentsLeft} payments left)</div>
                                    </div>
                                    <div class="text-right">
                                        <div class="font-black text-indigo-600 text-2xl">$${plan.installment.toFixed(2)} <span class="text-sm font-semibold text-gray-500">/ ea</span></div>
                                        <div class="text-xs uppercase font-bold text-green-700 bg-green-50 border border-green-100 px-3 py-1 rounded-full mt-3 inline-block">Active</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            </div>
        `;
    }

    // Initialize application
    window.onload = render;
  </script>
</body>
</html>
